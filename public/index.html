<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAK P100 Check-In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #23232f;
    --border: rgba(255,255,255,0.08);
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --green: #34d399;
    --red: #f87171;
    --amber: #fbbf24;
    --text: #f1f0f5;
    --muted: #8b8a99;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent2); }

  .postazione-badge {
    background: var(--accent);
    color: white;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .postazione-badge:hover { opacity: 0.85; }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--surface);
    padding: 1rem 1.5rem;
    text-align: center;
  }
  .stat-num { font-size: 1.8rem; font-weight: 700; }
  .stat-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
  .stat.green .stat-num { color: var(--green); }
  .stat.amber .stat-num { color: var(--amber); }
  .stat.accent .stat-num { color: var(--accent2); }

  .main { display: grid; grid-template-columns: 340px 1fr; gap: 0; height: calc(100vh - 130px); }

  .panel-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .search-box {
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .search-box input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--muted); }

  .filter-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .filter-tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .filter-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  .guest-list { overflow-y: auto; flex: 1; }
  .guest-item {
    padding: 0.9rem 1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .guest-item:hover { background: var(--surface2); }
  .guest-item.selected { background: rgba(108,99,255,0.12); border-left: 3px solid var(--accent); }

  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; font-weight: 600; flex-shrink: 0;
  }
  .avatar.pending { background: rgba(139,138,153,0.15); color: var(--muted); }
  .avatar.done { background: rgba(52,211,153,0.15); color: var(--green); }

  .guest-info { flex: 1; min-width: 0; }
  .guest-name { font-size: 0.9rem; font-weight: 500; }
  .guest-sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .status-dot.green { background: var(--green); }
  .status-dot.gray { background: var(--muted); }

  .panel-right {
    overflow-y: auto;
    padding: 2rem;
    background: var(--bg);
  }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); text-align: center;
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }

  .detail-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1.5rem;
  }
  .detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
  .detail-avatar {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700;
    background: rgba(108,99,255,0.15); color: var(--accent2);
  }
  .detail-name { font-size: 1.4rem; font-weight: 700; }
  .detail-ci { font-size: 0.8rem; color: var(--muted); margin-top: 4px; font-family: monospace; letter-spacing: 0.08em; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .detail-field label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .detail-field p { font-size: 0.95rem; margin-top: 4px; }

  .checkin-status {
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .checkin-status.pending { background: rgba(139,138,153,0.1); border: 1px solid rgba(139,138,153,0.2); }
  .checkin-status.done { background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2); }
  .checkin-status .icon { font-size: 1.5rem; }
  .checkin-status h3 { font-size: 0.95rem; font-weight: 600; }
  .checkin-status p { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }
  .btn-checkin { background: var(--accent); color: white; }
  .btn-checkin:hover { background: #5a52e0; transform: translateY(-1px); }
  .btn-undo { background: transparent; color: var(--red); border: 1px solid rgba(248,113,113,0.3); margin-top: 8px; }
  .btn-undo:hover { background: rgba(248,113,113,0.08); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .group-section { margin-bottom: 2rem; }
  .group-header {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    padding: 0 0 0.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
  }
  .group-count { font-weight: 700; color: var(--accent2); }
  .group-actions { display:flex; gap:8px; align-items:center; }
  .mini-btn { background: rgba(108,99,255,0.12); color: var(--accent2); border: 1px solid rgba(167,139,250,0.25); border-radius: 999px; padding: 6px 10px; font-size: 0.72rem; font-weight: 600; cursor: pointer; }
  .mini-btn:hover { background: rgba(108,99,255,0.2); }
  .mini-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .detail-actions { display: grid; gap: 10px; }
  .btn-secondary { background: transparent; color: var(--accent2); border: 1px solid rgba(167,139,250,0.3); }
  .btn-secondary:hover { background: rgba(108,99,255,0.08); }

  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    font-size: 0.9rem;
    z-index: 999;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    max-width: 320px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(52,211,153,0.4); }
  .toast.error { border-color: rgba(248,113,113,0.4); }

  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 360px;
  }
  .modal h3 { margin-bottom: 1rem; }
  .modal select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 0.95rem;
    margin-bottom: 1rem;
    outline: none;
  }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btns .btn { width: auto; flex: 1; padding: 10px; }
  .btn-cancel { background: var(--surface2); color: var(--text); }

  .tables-modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .tables-modal-overlay.show { display: flex; }
  .tables-modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 400px;
    max-width: 90vw;
  }
  .tables-modal h3 { margin-bottom: 1rem; font-size: 1.1rem; }
  .tables-modal ul { list-style: none; margin-bottom: 1.5rem; }
  .tables-modal ul li {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.95rem;
  }
  .tables-modal ul li:last-child { border-bottom: none; }
  .tables-modal ul li strong { color: var(--accent2); }

  .sos-btn {
    background: var(--red);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    animation: sos-pulse 2s infinite;
  }
  .sos-btn:hover { opacity: 0.85; transform: scale(1.04); }
  .sos-btn:disabled { opacity: 0.5; cursor: not-allowed; animation: none; }
  @keyframes sos-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.5); }
    50% { box-shadow: 0 0 0 7px rgba(248,113,113,0); }
  }

  /* LOGIN OVERLAY */
  .login-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-overlay.hidden { display: none; }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
    width: 360px;
    max-width: 90vw;
    text-align: center;
  }
  .login-box .login-icon { font-size: 2.5rem; margin-bottom: 1rem; }
  .login-box h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; }
  .login-box p { font-size: 0.85rem; color: var(--muted); margin-bottom: 1.8rem; }
  .login-box input[type="password"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px 16px;
    font-size: 1rem;
    outline: none;
    margin-bottom: 0.8rem;
    transition: border-color 0.2s;
    letter-spacing: 0.15em;
  }
  .login-box input[type="password"]:focus { border-color: var(--accent); }
  .login-box input[type="password"].error { border-color: var(--red); animation: shake 0.3s; }
  .login-error {
    font-size: 0.8rem;
    color: var(--red);
    margin-bottom: 0.8rem;
    min-height: 1.2em;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .panel-right { display: none; }
    .panel-right.mobile-show { display: block; }
  }
</style>
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h2>MAK P100 Check-In</h2>
    <p>Inserisci la password per accedere</p>
    <input type="password" id="login-input" placeholder="Password" onkeydown="if(event.key==='Enter') tryLogin()" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-checkin" onclick="tryLogin()">Accedi</button>
  </div>
</div>

<header>
  <h1>&#x2713; MAK P100 <span>Check-In</span></h1>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="sos-btn" id="sos-btn" onclick="sendSOS()">🚨 Assistenza urgente</button>
    <div class="postazione-badge" onclick="openPostazioneModal()">
      <span id="postazione-label">Seleziona postazione</span>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="stat-total">–</div>
    <div class="stat-label">Totale invitati</div>
  </div>
  <div class="stat green">
    <div class="stat-num" id="stat-entered">–</div>
    <div class="stat-label">Entrati</div>
  </div>
  <div class="stat amber">
    <div class="stat-num" id="stat-pending">–</div>
    <div class="stat-label">In attesa</div>
  </div>
  <div class="stat accent">
    <div class="stat-num" id="stat-pct">–</div>
    <div class="stat-label">Completamento</div>
  </div>
</div>

<div class="main">
  <div class="panel-left">
    <div class="search-box">
      <input type="text" id="search" placeholder="Cerca per nome, cognome, CI o invitante..." oninput="renderList()">
    </div>
    <div class="filter-tabs">
      <div class="filter-tab active" onclick="setFilter('all', this)">Tutti</div>
      <div class="filter-tab" onclick="setFilter('pending', this)">In attesa</div>
      <div class="filter-tab" onclick="setFilter('done', this)">Entrati</div>
      <div class="filter-tab" onclick="setFilter('group', this)">Per invitante</div>
    </div>
    <div class="guest-list" id="guest-list"></div>
  </div>

  <div class="panel-right" id="panel-right">
    <div class="empty-state" id="empty-state">
      <div class="icon">&#x1F464;</div>
      <p>Seleziona un invitato dalla lista</p>
    </div>
    <div id="detail-view" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="postazione-modal">
  <div class="modal">
    <h3>Seleziona postazione</h3>
    <select id="postazione-select">
        <option value="Postazione 1">Postazione 1</option>
        <option value="Postazione 2">Postazione 2</option>
        <option value="Postazione 3">Postazione 3</option>
        <option value="Postazione 4">Postazione 4</option>
    </select>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closePostazioneModal()">Annulla</button>
      <button class="btn btn-checkin" onclick="confirmPostazione()">Conferma</button>
    </div>
  </div>
</div>

<div class="tables-modal-overlay" id="tables-modal">
  <div class="tables-modal">
    <h3>🪑 Tavoli invitati registrati</h3>
    <ul id="tables-modal-list"></ul>
    <button class="btn btn-checkin" onclick="closeTablesModal()">Chiudi</button>
  </div>
</div>

<script>
const API = '';
let guests = [];
let filter = 'all';
let selectedCI = null;
let selectedInvitante = null;
let currentPostazione = null;



async function loadData() {
  try {
    const [gRes, sRes] = await Promise.all([
      fetch(API + '/api/guests'),
      fetch(API + '/api/stats')
    ]);
    guests = await gRes.json();
    const stats = await sRes.json();
    document.getElementById('stat-total').textContent = stats.total;
    document.getElementById('stat-entered').textContent = stats.entered;
    document.getElementById('stat-pending').textContent = stats.pending;
    document.getElementById('stat-pct').textContent = stats.total > 0 ? Math.round(stats.entered / stats.total * 100) + '%' : '0%';
    renderList();
    if (selectedCI) renderDetail(selectedCI);
    // FIX: aggiorna la vista gruppo dopo ogni refresh automatico
    if (selectedInvitante && !selectedCI) renderInvitanteDetail(selectedInvitante);
  } catch(e) {
    showToast('Errore connessione al server', 'error');
  }
}

function setFilter(f, el) {
  filter = f;
  selectedInvitante = null;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderList();
  if (selectedCI) renderDetail(selectedCI);
}

function getInitials(nome, cognome) {
  const first = (nome || '').trim()[0] || '?';
  const second = (cognome || '').trim()[0] || '';
  return (first + second).toUpperCase();
}

function getTableLabel(g) {
  const tableNumber = (g.numero_tavolo || '').trim();
  return tableNumber ? 'Tavolo ' + tableNumber : 'Tavolo non assegnato';
}

function showCheckinTables(checkedGuests) {
  if (!checkedGuests.length) return;
  const ul = document.getElementById('tables-modal-list');
  ul.innerHTML = checkedGuests.map(g =>
    `<li>${g.nome} ${g.cognome} &mdash; <strong>${getTableLabel(g)}</strong></li>`
  ).join('');
  document.getElementById('tables-modal').classList.add('show');
}

function closeTablesModal() {
  document.getElementById('tables-modal').classList.remove('show');
  loadData();
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const list = document.getElementById('guest-list');

  let filtered = guests.filter(g => {
    const haystack = [g.nome, g.cognome, g.codice_carta_identita, g.invitante, g.numero_tavolo].filter(Boolean).join(' ').toLowerCase();
    const match = !q || haystack.includes(q);
    if (!match) return false;
    if (filter === 'pending') return !g.checkin;
    if (filter === 'done') return !!g.checkin;
    return true;
  });

  if (filter === 'group') {
    const groups = {};
    filtered.forEach(g => {
      const key = g.invitante || 'Senza invitante';
      if (!groups[key]) groups[key] = [];
      groups[key].push(g);
    });
    list.innerHTML = Object.entries(groups).map(([inv, items]) => {
      const entered = items.filter(i => i.checkin).length;
      const pending = items.filter(i => !i.checkin).length;
      const selected = selectedInvitante === inv ? 'selected' : '';
      return `<div class="group-section ${selected}">
        <div class="group-header">
          <span onclick="selectInvitante(${JSON.stringify(inv).replace(/"/g,'&quot;')})" style="cursor:pointer">${inv}</span>
          <div class="group-actions">
            <span class="group-count">${entered}/${items.length}</span>
            <button class="mini-btn"
              data-invitante="${inv.replace(/"/g, '&quot;')}"
              onclick="event.stopPropagation(); bulkCheckinFromBtn(this)"
              ${pending === 0 || !currentPostazione ? 'disabled' : ''}
              title="${!currentPostazione ? 'Seleziona prima una postazione' : pending === 0 ? 'Tutti già registrati' : 'Registra tutti gli arrivi del gruppo'}">Flag arrivo tutti</button>
          </div>
        </div>
        ${items.map(g => guestItemHTML(g)).join('')}
      </div>`;
    }).join('');
    if (!list.innerHTML) list.innerHTML = '<div class="empty-state" style="height:auto;padding:2rem 1rem"><p>Nessun invitante trovato</p></div>';
  } else {
    list.innerHTML = filtered.map(g => guestItemHTML(g)).join('');
    if (!list.innerHTML) list.innerHTML = '<div class="empty-state" style="height:auto;padding:2rem 1rem"><p>Nessun invitato trovato</p></div>';
  }
}

function guestItemHTML(g) {
  const done = !!g.checkin;
  const sel = g.codice_carta_identita === selectedCI ? 'selected' : '';
  return `<div class="guest-item ${sel}" onclick="selectGuest('${g.codice_carta_identita}')">
    <div class="avatar ${done ? 'done' : 'pending'}">${getInitials(g.nome, g.cognome)}</div>
    <div class="guest-info">
      <div class="guest-name">${g.nome} ${g.cognome}</div>
      <div class="guest-sub">${done ? '&#x2713; Entrato &mdash; ' + g.checkin.postazione : 'Invitato da: ' + g.invitante}</div>
    </div>
    <div class="status-dot ${done ? 'green' : 'gray'}"></div>
  </div>`;
}

function selectGuest(ci) {
  selectedCI = ci;
  const guest = guests.find(x => x.codice_carta_identita === ci);
  selectedInvitante = guest ? (guest.invitante || null) : selectedInvitante;
  renderList();
  renderDetail(ci);
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
}

function selectInvitante(invitante) {
  selectedInvitante = invitante;
  selectedCI = null;
  renderList();
  renderInvitanteDetail(invitante);
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
}

function renderDetail(ci) {
  const g = guests.find(x => x.codice_carta_identita === ci);
  if (!g) return;
  const done = !!g.checkin;
  const v = document.getElementById('detail-view');
  v.innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${getInitials(g.nome, g.cognome)}</div>
        <div>
          <div class="detail-name">${g.nome} ${g.cognome}</div>
          <div class="detail-ci">${g.codice_carta_identita}</div>
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-field">
          <label>Invitato da</label>
          <p>${g.invitante}</p>
        </div>
        <div class="detail-field">
          <label>Stato</label>
          <p style="color: ${done ? 'var(--green)' : 'var(--muted)'}">${done ? 'Entrato' : 'Non ancora entrato'}</p>
        </div>
        <div class="detail-field">
          <label>Numero tavolo</label>
          <p>${getTableLabel(g)}</p>
        </div>
      </div>
    </div>

    <div class="checkin-status ${done ? 'done' : 'pending'}">
      <div class="icon">${done ? '&#x2705;' : '&#x23F3;'}</div>
      <div>
        <h3>${done ? 'Check-in effettuato' : 'In attesa di ingresso'}</h3>
        <p>${done ? 'Ore ' + new Date(g.checkin.timestamp).toLocaleTimeString('it-IT') + ' &mdash; ' + g.checkin.postazione : 'Non ancora registrato'}</p>
      </div>
    </div>

    ${!done ? `<button class="btn btn-checkin" onclick="doCheckin('${g.codice_carta_identita}')" ${!currentPostazione ? 'disabled title="Seleziona prima una postazione"' : ''}>
      &#x2713; Registra ingresso ${currentPostazione ? '&mdash; ' + currentPostazione : ''}
    </button>` : `<button class="btn btn-undo" onclick="undoCheckin('${g.codice_carta_identita}')">Annulla ingresso</button>`}
  `;
}

function renderInvitanteDetail(invitante) {
  const items = guests.filter(x => (x.invitante || 'Senza invitante') === invitante);
  if (!items.length) return;
  const entered = items.filter(x => x.checkin).length;
  const pendingItems = items.filter(x => !x.checkin);
  const v = document.getElementById('detail-view');
  v.innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-avatar">${invitante.split(' ').map(x => x[0] || '').slice(0,2).join('').toUpperCase() || 'I'}</div>
        <div>
          <div class="detail-name">${invitante}</div>
          <div class="detail-ci">Gruppo invitante</div>
        </div>
      </div>
      <div class="detail-grid">
        <div class="detail-field">
          <label>Totale invitati</label>
          <p>${items.length}</p>
        </div>
        <div class="detail-field">
          <label>Entrati</label>
          <p style="color: var(--green)">${entered}</p>
        </div>
        <div class="detail-field">
          <label>In attesa</label>
          <p style="color: var(--amber)">${pendingItems.length}</p>
        </div>
        <div class="detail-field">
          <label>Postazione corrente</label>
          <p>${currentPostazione || 'Non selezionata'}</p>
        </div>
      </div>
    </div>

    <div class="checkin-status ${pendingItems.length ? 'pending' : 'done'}">
      <div class="icon">${pendingItems.length ? '&#x1F465;' : '&#x2705;'}</div>
      <div>
        <h3>${pendingItems.length ? 'Arrivi di gruppo disponibili' : 'Tutti gli invitati sono già entrati'}</h3>
        <p>${pendingItems.length ? pendingItems.length + ' invitati ancora da registrare' : 'Nessuna azione necessaria'}</p>
      </div>
    </div>

    <div class="detail-actions">
      <button class="btn btn-checkin" onclick='bulkCheckin(${JSON.stringify(invitante)}, false)' ${!pendingItems.length || !currentPostazione ? 'disabled title="Seleziona prima una postazione"' : ''}>
        &#x2713; Registra tutti gli arrivi ${currentPostazione ? '&mdash; ' + currentPostazione : ''}
      </button>
      <button class="btn btn-secondary" onclick="focusFirstPending(${JSON.stringify(invitante)})" ${!pendingItems.length ? 'disabled' : ''}>Apri primo invitato in attesa</button>
    </div>
  `;
}

function focusFirstPending(invitante) {
  const first = guests.find(x => (x.invitante || 'Senza invitante') === invitante && !x.checkin);
  if (first) selectGuest(first.codice_carta_identita);
}

// Wrapper sicuro per il bottone inline nella lista gruppi (legge il nome dal data-attribute)
function bulkCheckinFromBtn(btn) {
  const invitante = btn.getAttribute('data-invitante');
  if (!invitante) return;
  bulkCheckin(invitante, true);
}

async function bulkCheckin(invitante, silent) {
  if (!currentPostazione) { showToast('Seleziona prima una postazione', 'error'); return; }
  const pending = guests.filter(x => (x.invitante || 'Senza invitante') === invitante && !x.checkin);
  if (!pending.length) { showToast('Tutti già registrati', 'error'); return; }
  const checkedGuests = [];
  let ok = 0;
  let failed = 0;
  for (const guest of pending) {
    try {
      const res = await fetch(API + '/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codice_carta_identita: guest.codice_carta_identita, postazione: currentPostazione })
      });
      const data = await res.json().catch(() => null);
      if (res.ok) {
        ok++;
        checkedGuests.push(data && data.guest ? data.guest : guest);
      } else {
        failed++;
      }
    } catch (e) {
      failed++;
    }
  }
  await loadData();
  selectedInvitante = invitante;
  renderInvitanteDetail(invitante);
  showToast((silent ? '' : 'Gruppo ' + invitante + ': ') + ok + ' registrati' + (failed ? ', ' + failed + ' non riusciti' : ''), failed ? 'error' : 'success');
  showCheckinTables(checkedGuests);
}

async function doCheckin(ci) {
  if (!currentPostazione) { showToast('Seleziona prima una postazione', 'error'); return; }
  try {
    const res = await fetch(API + '/api/checkin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codice_carta_identita: ci, postazione: currentPostazione })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('&#x2713; ' + data.guest.nome + ' ' + data.guest.cognome + ' registrato!', 'success');
      showCheckinTables([data.guest]);
      loadData();
    } else if (res.status === 409) {
      showToast('Invitato già registrato', 'error');
    } else {
      showToast(data.error || 'Errore', 'error');
    }
  } catch(e) {
    showToast('Errore di rete', 'error');
  }
}

async function undoCheckin(ci) {
  if (!confirm('Annullare il check-in?')) return;
  try {
    const res = await fetch(API + '/api/checkin/' + ci, { method: 'DELETE' });
    if (res.ok) {
      showToast('Check-in annullato', 'success');
      loadData();
    }
  } catch(e) {
    showToast('Errore di rete', 'error');
  }
}

function openPostazioneModal() {
  document.getElementById('postazione-modal').classList.add('show');
  if (currentPostazione) document.getElementById('postazione-select').value = currentPostazione;
}
function closePostazioneModal() {
  document.getElementById('postazione-modal').classList.remove('show');
}
function confirmPostazione() {
  currentPostazione = document.getElementById('postazione-select').value;
  document.getElementById('postazione-label').textContent = currentPostazione;
  closePostazioneModal();
  if (selectedCI) renderDetail(selectedCI);
  if (selectedInvitante) renderInvitanteDetail(selectedInvitante);
  renderList();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => t.className = 'toast', 3500);
}
