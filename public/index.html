<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAK P100 Check-In</title>

  <link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LOGIN OVERLAY -->
<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h2>MAK P100 Check-In</h2>
    <p>Inserisci la password per accedere</p>
    <input type="password" id="login-input" placeholder="Password" onkeydown="if(event.key==='Enter') tryLogin()" autofocus>
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-checkin" onclick="tryLogin()">Accedi</button>
  </div>
</div>

<header>
  <h1>&#x2713; MAK P100 <span>Check-In</span></h1>
  <div style="display:flex;gap:10px;align-items:center;">
    <button class="sos-btn" id="sos-btn" onclick="sendSOS()">🚨 Assistenza urgente</button>
    <div class="postazione-badge" onclick="openPostazioneModal()">
      <span id="postazione-label">Seleziona postazione</span>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-num" id="stat-total">–</div>
    <div class="stat-label">Totale invitati</div>
  </div>
  <div class="stat green">
    <div class="stat-num" id="stat-entered">–</div>
    <div class="stat-label">Entrati</div>
  </div>
  <div class="stat amber">
    <div class="stat-num" id="stat-pending">–</div>
    <div class="stat-label">In attesa</div>
  </div>
  <div class="stat accent">
    <div class="stat-num" id="stat-pct">–</div>
    <div class="stat-label">Completamento</div>
  </div>
</div>

<div class="main">
  <div class="panel-left">
    <div class="search-box">
      <input type="text" id="search" placeholder="Cerca per nome, cognome, CI o invitante..." oninput="renderList()">
    </div>
    <div class="filter-tabs">
      <div class="filter-tab active" onclick="setFilter('all', this)">Tutti</div>
      <div class="filter-tab" onclick="setFilter('pending', this)">In attesa</div>
      <div class="filter-tab" onclick="setFilter('done', this)">Entrati</div>
      <div class="filter-tab" onclick="setFilter('group', this)">Per invitante</div>
    </div>
    <div class="guest-list" id="guest-list"></div>
  </div>

  <div class="panel-right" id="panel-right">
    <div class="empty-state" id="empty-state">
      <div class="icon">&#x1F464;</div>
      <p>Seleziona un invitato dalla lista</p>
    </div>
    <div id="detail-view" style="display:none"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="postazione-modal">
  <div class="modal">
    <h3>Seleziona postazione</h3>
    <select id="postazione-select">
        <option value="Postazione 1">Postazione 1</option>
        <option value="Postazione 2">Postazione 2</option>
        <option value="Postazione 3">Postazione 3</option>
        <option value="Postazione 4">Postazione 4</option>
    </select>
    <div class="modal-btns">
      <button class="btn btn-cancel" onclick="closePostazioneModal()">Annulla</button>
      <button class="btn btn-checkin" onclick="confirmPostazione()">Conferma</button>
    </div>
  </div>
</div>

<div class="tables-modal-overlay" id="tables-modal">
  <div class="tables-modal">
    <h3>🪑 Tavoli invitati registrati</h3>
    <ul id="tables-modal-list"></ul>
    <button class="btn btn-checkin" onclick="closeTablesModal()">Chiudi</button>
  </div>
</div>


  <script src="/app.js" defer></script>
</body>
</html>
